version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: hotel-postgres-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: hotel_db
      POSTGRES_USER: hotel_user
      POSTGRES_PASSWORD: SecureHotelPassword123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel_user -d hotel_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
